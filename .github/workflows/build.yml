name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset: saturn-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: saturn-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (static)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" LDFLAGS="-static"
      - name: Smoke test
        run: |
          ./saturn --version
          ./saturn --dump 80x24 3 > frame.txt
          test "$(wc -l < frame.txt)" -eq 24
          grep -q '@\|#\|%' frame.txt
      - run: mv saturn ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal arm64 + x86_64)
        run: make CC=clang CFLAGS="-O2 -Wall -Wextra -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=10.13"
      - name: Smoke test
        run: |
          lipo -info saturn
          ./saturn --version
          ./saturn --dump 80x24 3 > frame.txt
          test "$(wc -l < frame.txt)" -eq 24
      - run: mv saturn saturn-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: saturn-macos-universal
          path: saturn-macos-universal

  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross-compile (static)
        run: make OS=Windows_NT CC=x86_64-w64-mingw32-gcc STRIP=x86_64-w64-mingw32-strip CFLAGS="-O2 -Wall -Wextra -Werror" LDFLAGS="-static"
      - run: mv saturn.exe saturn-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: saturn-windows-x86_64.exe
          path: saturn-windows-x86_64.exe

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saturn-windows-x86_64.exe
      - name: Smoke test
        shell: pwsh
        run: |
          .\saturn-windows-x86_64.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $frame = .\saturn-windows-x86_64.exe --dump 80x24 3
          if ($frame.Count -ne 24) { Write-Error "expected 24 lines, got $($frame.Count)"; exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/saturn-linux-* dist/saturn-macos-*
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "saturn $GITHUB_REF_NAME" --generate-notes

  install-test:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: One-line install (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install/install.sh | sh
          ~/.local/bin/saturn --version
      - name: One-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install/install.ps1 | iex
          saturn --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
